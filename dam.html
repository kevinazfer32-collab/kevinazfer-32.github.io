<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dam / Checkers </title>
  <style>
    *{box-sizing:border-box;font-family:sans-serif}
    body{background:#121212;color:#fff;margin:0;padding:10px;display:flex;flex-direction:column;align-items:center;min-height:100vh}
    h2{margin:5px 0 10px;font-size:1.4rem;text-align:center}
    .controls{background:#1e1e1e;padding:8px;border-radius:8px;margin-bottom:10px;display:flex;gap:6px;flex-wrap:wrap;justify-content:center;width:100%;max-width:400px}
    select,button{padding:8px 10px;border-radius:4px;border:1px solid #444;background:#2b2b2b;color:#fff;cursor:pointer;font-size:13px}
    button{background:#e74c3c;color:#fff;font-weight:bold;border:none}
    #status{font-size:15px;font-weight:bold;margin-bottom:8px;color:#f1c40f;text-align:center}
    #board{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);width:min(92vw,400px);height:min(92vw,400px);border:3px solid #444;box-shadow:0 4px 10px rgba(0,0,0,0.5)}
    .tile{display:flex;justify-content:center;align-items:center;user-select:none;cursor:pointer}
    .light{background:#f0d9b5}.dark{background:#b58863}
    .selected{background:#729c34!important}.highlight{background:#a3d154!important}
    .checker{width:75%;height:75%;border-radius:50%;display:flex;justify-content:center;align-items:center;font-size:16px;box-shadow:0 3px 6px rgba(0,0,0,0.4)}
    .red-checker{background:#e74c3c;border:3px solid #922b21;color:#fff}
    .white-checker{background:#ecf0f1;border:3px solid #bdc3c7;color:#000}
  </style>
</head>
<body>
  <h2>Dam / Checkers </h2>
  <div class="controls">
    <select id="playMode" onchange="resetGame()"><option value="pvp">Player vs Player</option><option value="bot">Player vs Bot</option></select>
    <select id="botLevel"><option value="easy">Bot: Pemula</option><option value="normal">Bot: Sedang</option><option value="hard" selected>Bot: Taktis</option></select>
    <button onclick="resetGame()">Reset Game</button>
  </div>
  <div id="status">Giliran: Putih</div>
  <div id="board"></div>

  <script>
    let boardEl, statusEl, playMode = 'pvp', turn = 'w', board = [], selectedTile = null, validMoves = [], isGameOver = false;
    let mustContinueJumpFrom = null; // Untuk menangani fitur multi-jump / makan beruntun

    window.onload = function() {
      boardEl = document.getElementById('board');
      statusEl = document.getElementById('status');
      resetGame();
    };

    function resetGame() {
      playMode = document.getElementById('playMode').value;
      turn = 'w'; selectedTile = null; validMoves = []; isGameOver = false; mustContinueJumpFrom = null;
      initBoard(); renderBoard(); updateStatus();
    }

    function initBoard() {
      board = []; for (let r = 0; r < 8; r++) board[r] = Array(8).fill(null);
      // Papan Dam standar: Bidak ditempatkan di kotak gelap
      for (let r = 0; r < 3; r++) for (let c = 0; c < 8; c++) if ((r + c) % 2 === 1) board[r][c] = 'b';
      for (let r = 5; r < 8; r++) for (let c = 0; c < 8; c++) if ((r + c) % 2 === 1) board[r][c] = 'w';
    }

    function renderBoard() {
      if (!boardEl) return; boardEl.innerHTML = '';

      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const tile = document.createElement('div');
          tile.className = 'tile ' + ((r + c) % 2 === 0 ? 'light' : 'dark');
          
          if (selectedTile && selectedTile.r === r && selectedTile.c === c) tile.classList.add('selected');
          for (let i = 0; i < validMoves.length; i++) {
            if (validMoves[i].r === r && validMoves[i].c === c) tile.classList.add('highlight');
          }

          const val = board[r][c];
          if (val) {
            const piece = document.createElement('div');
            piece.className = 'checker ' + (val.toLowerCase() === 'w' ? 'white-checker' : 'red-checker');
            if (val === 'W' || val === 'B') piece.innerText = '👑';
            tile.appendChild(piece);
          }

          tile.onclick = function() { handleTileClick(r, c); };
          boardEl.appendChild(tile);
        }
      }
    }

    function handleTileClick(r, c) {
      if (isGameOver || (playMode === 'bot' && turn === 'b')) return;

      // Jika sedang dalam kondisi wajib makan beruntun (multi-jump), kunci pilihan hanya pada bidak tersebut
      if (mustContinueJumpFrom) {
        if (selectedTile && selectedTile.r === mustContinueJumpFrom.r && selectedTile.c === mustContinueJumpFrom.c) {
          let chosenMove = null;
          for (let i = 0; i < validMoves.length; i++) {
            if (validMoves[i].r === r && validMoves[i].c === c) { chosenMove = validMoves[i]; break; }
          }
          if (chosenMove) processMove(selectedTile, chosenMove);
        }
        return;
      }

      const piece = board[r][c];
      if (piece && isOwnPiece(piece, turn)) {
        selectedTile = { r, c };
        validMoves = getCheckerMoves(r, c, board);
        renderBoard();
        return;
      }

      if (selectedTile) {
        let chosenMove = null;
        for (let i = 0; i < validMoves.length; i++) {
          if (validMoves[i].r === r && validMoves[i].c === c) { chosenMove = validMoves[i]; break; }
        }
        if (chosenMove) processMove(selectedTile, chosenMove);
      }
    }

    function isOwnPiece(piece, pColor) {
      if (!piece) return false;
      return pColor === 'w' ? piece.toLowerCase() === 'w' : piece.toLowerCase() === 'b';
    }

    function processMove(from, to) {
      const isJump = executeMove(from, to, board);
      
      // Cek apakah ada jump lanjutan (Makan Beruntun)
      if (isJump) {
        const nextJumps = getCheckerMoves(to.r, to.c, board).filter(m => m.isJump);
        if (nextJumps.length > 0) {
          mustContinueJumpFrom = { r: to.r, c: to.c };
          selectedTile = mustContinueJumpFrom;
          validMoves = nextJumps;
          renderBoard();
          updateStatus(" ➡️ WAJIB MAKAN LAGI!");
          if (playMode === 'bot' && turn === 'b') setTimeout(makeBotMove, 400);
          return;
        }
      }

      mustContinueJumpFrom = null;
      selectedTile = null; validMoves = [];
      switchTurn();
    }

    function executeMove(from, to, bState) {
      const p = bState[from.r][from.c];
      let isJump = false;

      bState[to.r][to.c] = p;
      bState[from.r][from.c] = null;

      // Jika melompati/memakan bidak lawan
      if (Math.abs(to.r - from.r) === 2) {
        const jumpedR = (from.r + to.r) / 2;
        const jumpedC = (from.c + to.c) / 2;
        bState[jumpedR][jumpedC] = null;
        isJump = true;
      }

      // Promosi Jadi Raja (King 👑)
      if (p === 'w' && to.r === 0) bState[to.r][to.c] = 'W';
      if (p === 'b' && to.r === 7) bState[to.r][to.c] = 'B';

      return isJump;
    }

    function getCheckerMoves(r, c, bState) {
      const moves = [];
      const p = bState[r][c]; if (!p) return moves;
      const isWhite = p.toLowerCase() === 'w';
      const isKing = (p === 'W' || p === 'B');
      const dirs = [];

      if (isWhite || isKing) dirs.push([-1, -1], [-1, 1]);
      if (!isWhite || isKing) dirs.push([1, -1], [1, 1]);

      for (let i = 0; i < dirs.length; i++) {
        const dr = dirs[i][0], dc = dirs[i][1];
        const nr = r + dr, nc = c + dc;
        const jR = r + (2 * dr), jC = c + (2 * dc);

        // Langkah Biasa (1 Kotak)
        if (!mustContinueJumpFrom && nr >= 0 && nr < 8 && nc >= 0 && nc < 8 && !bState[nr][nc]) {
          moves.push({ r: nr, c: nc, isJump: false });
        }

        // Langkah Memakan / Melompat (2 Kotak)
        if (jR >= 0 && jR < 8 && jC >= 0 && jC < 8) {
          const midPiece = bState[nr][nc];
          if (midPiece && !isOwnPiece(midPiece, isWhite ? 'w' : 'b') && !bState[jR][jC]) {
            moves.push({ r: jR, c: jC, isJump: true });
          }
        }
      }
      return moves;
    }

    function getAllMovesForColor(pColor, bState) {
      const allMoves = [];
      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          if (bState[r][c] && isOwnPiece(bState[r][c], pColor)) {
            const moves = getCheckerMoves(r, c, bState);
            for (let i = 0; i < moves.length; i++) {
              allMoves.push({ from: { r, c }, to: moves[i] });
            }
          }
        }
      }
      // Aturan Dam: Jika ada kesempatan memakan bidak lawan, WAJIB memakan (filter hanya jump)
      const jumpMoves = allMoves.filter(m => m.to.isJump);
      return jumpMoves.length > 0 ? jumpMoves : allMoves;
    }

    function switchTurn() {
      turn = (turn === 'w') ? 'b' : 'w';
      const availableMoves = getAllMovesForColor(turn, board);

      if (availableMoves.length === 0) {
        isGameOver = true;
        const winner = (turn === 'w') ? "Merah" : "Putih";
        statusEl.innerText = "🎉 " + winner + " Menang!";
        alert("🎉 GAME OVER! " + winner + " menang karena lawan tidak punya langkah tersisa!");
        renderBoard();
        return;
      }

      updateStatus();
      renderBoard();

      if (playMode === 'bot' && turn === 'b' && !isGameOver) {
        setTimeout(makeBotMove, 400);
      }
    }

    function updateStatus(extraText = "") {
      if (statusEl) {
        const colorText = turn === 'w' ? "Putih" : "Merah";
        statusEl.innerText = "Giliran: " + colorText + extraText;
      }
    }

    function makeBotMove() {
      let availableMoves = [];
      if (mustContinueJumpFrom) {
        const nextJumps = getCheckerMoves(mustContinueJumpFrom.r, mustContinueJumpFrom.c, board).filter(m => m.isJump);
        availableMoves = nextJumps.map(m => ({ from: mustContinueJumpFrom, to: m }));
      } else {
        availableMoves = getAllMovesForColor('b', board);
      }

      if (availableMoves.length === 0) return;

      const lvl = document.getElementById('botLevel').value;
      let chosenMove = null;

      if (lvl === 'easy') {
        chosenMove = availableMoves[Math.floor(Math.random() * availableMoves.length)];
      } else {
        // Taktis: Prioritaskan gerakan memakan bidak atau yang menghasilkan Raja
        const jumpMoves = availableMoves.filter(m => m.to.isJump);
        if (jumpMoves.length > 0) {
          chosenMove = jumpMoves[Math.floor(Math.random() * jumpMoves.length)];
        } else {
          chosenMove = availableMoves[Math.floor(Math.random() * availableMoves.length)];
        }
      }

      processMove(chosenMove.from, chosenMove.to);
    }
  </script>
</body>
</html>
